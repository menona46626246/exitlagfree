name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore GameRouteOptimizer.sln

      - name: Build solution (Release)
        run: dotnet build GameRouteOptimizer.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test src/GameRouteOptimizer.Tests/GameRouteOptimizer.Tests.csproj -c Release --no-build --verbosity normal
