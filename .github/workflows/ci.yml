# CI de GameRoute Optimizer — sin acciones de terceros (solo comandos del runner).
# Compila, prueba y hace smoke-test de la UI en Windows; núcleo + tests en Linux.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  windows:
    name: Windows (build + tests + UI)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Obtener código fuente
        run: |
          git init -q .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($env:GITHUB_REF_NAME -eq '') { throw 'GITHUB_REF_NAME vacío' }
          git fetch -q --depth 1 origin "refs/heads/$env:GITHUB_REF_NAME"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Asegurar .NET 8 SDK
        run: |
          $have = dotnet --list-sdks 2>$null
          if ($have -notmatch '^8\.') {
            Write-Host 'SDK 8 no presente; instalando dotnet-install…'
            Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile "$env:TEMP\dotnet-install.ps1"
            & "$env:TEMP\dotnet-install.ps1" -Channel 8.0 -InstallDir "$HOME\.dotnet"
            $env:PATH = "$HOME\.dotnet;$env:PATH"
            $env:DOTNET_ROOT = "$HOME\.dotnet"
          }
          dotnet --info

      - name: Restaurar
        run: dotnet restore src/GameRouteOptimizer.sln

      - name: Compilar (Release)
        run: |
          dotnet build src/GameRouteOptimizer.sln -c Release --no-restore 2>&1 | Out-File -FilePath "$env:TEMP\gro-build.log" -Encoding utf8
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Primero errores de compilación clásicos; si no hay, las últimas líneas del log.
            $hits = Get-Content "$env:TEMP\gro-build.log" | Select-String -Pattern 'error [A-Z]+[0-9]+' | Select-Object -First 40
            if ($hits) {
              $hits | ForEach-Object { Write-Output "::error title=build::$($_.Line)" }
            } else {
              Get-Content "$env:TEMP\gro-build.log" | Select-Object -Last 60 | ForEach-Object {
                Write-Output "::error title=build::$_"
              }
            }
            exit $code
          }

      - name: Ejecutar tests (xUnit)
        run: |
          dotnet test src/GameRouteOptimizer.sln -c Release --no-build --logger "trx;LogFileName=results.trx" 2>&1 | Out-File -FilePath "$env:TEMP\gro-test.log" -Encoding utf8
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $hits = Get-Content "$env:TEMP\gro-test.log" | Select-String -Pattern 'Failed|error [A-Z]+[0-9]+' | Select-Object -First 40
            if ($hits) {
              $hits | ForEach-Object { Write-Output "::error title=tests::$($_.Line)" }
            } else {
              Get-Content "$env:TEMP\gro-test.log" | Select-Object -Last 60 | ForEach-Object {
                Write-Output "::error title=tests::$_"
              }
            }
            exit $code
          }

      - name: Verificar formato (dotnet format, informativo)
        run: dotnet format src/GameRouteOptimizer.sln --verify-no-changes --no-restore
        continue-on-error: true

      - name: Smoke-test de la UI (abre la ventana y sale sola)
        run: |
          $exe = "src/GameRouteOptimizer.App/bin/Release/net8.0-windows/GameRouteOptimizer.App.exe"
          if (-not (Test-Path $exe)) { throw "No se encontró el ejecutable: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Timeout: la UI no terminó el smoke-test' }
          Write-Host "Código de salida del smoke-test: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "El smoke-test de la UI falló (código $($p.ExitCode))" }

  linux-core:
    name: Linux (núcleo + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código fuente
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/heads/${GITHUB_REF_NAME}"
          git checkout -q FETCH_HEAD

      - name: Asegurar .NET 8 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^8\.'; then
            echo "SDK 8 no presente; instalando dotnet-install…"
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
            echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          fi
          dotnet --info

      - name: Compilar núcleo, CLI y servicio (net8.0)
        run: |
          set +e
          failed=0
          : > /tmp/gro-build.log
          for proj in src/GameRouteOptimizer.Core/GameRouteOptimizer.Core.csproj \
                      src/GameRouteOptimizer.Cli/GameRouteOptimizer.Cli.csproj \
                      src/GameRouteOptimizer.Service/GameRouteOptimizer.Service.csproj; do
            dotnet build "$proj" -c Release >> /tmp/gro-build.log 2>&1
            if [ $? -ne 0 ]; then failed=1; fi
          done
          if [ $failed -ne 0 ]; then
            # Errores de compilación como anotaciones legibles en el resumen del job.
            grep -E 'error [A-Z]+[0-9]+' /tmp/gro-build.log | head -40 | while IFS= read -r line; do
              echo "::error title=build::${line}"
            done
            exit 1
          fi

      - name: Tests del núcleo en Linux
        run: |
          set +e
          dotnet test src/GameRouteOptimizer.Tests/GameRouteOptimizer.Tests.csproj -c Release 2>&1 | tee /tmp/gro-test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E 'error [A-Z]+[0-9]+|Failed!|Failed:' /tmp/gro-test.log | head -40 | while IFS= read -r line; do
              echo "::error title=tests::${line}"
            done
            exit $code
          fi
