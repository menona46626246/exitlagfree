# CI de GameRoute Optimizer — sin acciones de terceros (solo comandos del runner).
# Compila, prueba y hace smoke-test de la UI en Windows; núcleo + tests en Linux.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  windows:
    name: Windows (build + tests + UI)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Obtener código fuente
        run: |
          git init -q .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($env:GITHUB_REF_NAME -eq '') { throw 'GITHUB_REF_NAME vacío' }
          git fetch -q --depth 1 origin "refs/heads/$env:GITHUB_REF_NAME"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Asegurar .NET 8 SDK
        run: |
          $have = dotnet --list-sdks 2>$null
          if ($have -notmatch '^8\.') {
            Write-Host 'SDK 8 no presente; instalando dotnet-install…'
            Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile "$env:TEMP\dotnet-install.ps1"
            & "$env:TEMP\dotnet-install.ps1" -Channel 8.0 -InstallDir "$HOME\.dotnet"
            $env:PATH = "$HOME\.dotnet;$env:PATH"
            $env:DOTNET_ROOT = "$HOME\.dotnet"
          }
          dotnet --info

      - name: Restaurar
        run: dotnet restore src/GameRouteOptimizer.sln

      - name: Compilar (Release)
        run: dotnet build src/GameRouteOptimizer.sln -c Release --no-restore

      - name: Ejecutar tests (xUnit)
        run: dotnet test src/GameRouteOptimizer.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Verificar formato (dotnet format, informativo)
        run: dotnet format src/GameRouteOptimizer.sln --verify-no-changes --no-restore
        continue-on-error: true

      - name: Smoke-test de la UI (abre la ventana y sale sola)
        run: |
          $exe = "src/GameRouteOptimizer.App/bin/Release/net8.0-windows/GameRouteOptimizer.App.exe"
          if (-not (Test-Path $exe)) { throw "No se encontró el ejecutable: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Timeout: la UI no terminó el smoke-test' }
          Write-Host "Código de salida del smoke-test: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "El smoke-test de la UI falló (código $($p.ExitCode))" }

  linux-core:
    name: Linux (núcleo + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código fuente
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/heads/${GITHUB_REF_NAME}"
          git checkout -q FETCH_HEAD

      - name: Asegurar .NET 8 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^8\.'; then
            echo "SDK 8 no presente; instalando dotnet-install…"
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
            echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          fi
          dotnet --info

      - name: Compilar núcleo, CLI y servicio (net8.0)
        run: |
          dotnet build src/GameRouteOptimizer.Core/GameRouteOptimizer.Core.csproj -c Release
          dotnet build src/GameRouteOptimizer.Cli/GameRouteOptimizer.Cli.csproj -c Release
          dotnet build src/GameRouteOptimizer.Service/GameRouteOptimizer.Service.csproj -c Release

      - name: Tests del núcleo en Linux
        run: dotnet test src/GameRouteOptimizer.Tests/GameRouteOptimizer.Tests.csproj -c Release
