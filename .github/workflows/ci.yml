name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        shell: pwsh
        run: |
          git init
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Verify .NET SDK
        shell: pwsh
        run: dotnet --version

      - name: Build and test (Release)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Release
