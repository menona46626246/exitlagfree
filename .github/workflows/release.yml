name: Release firmada

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p tramoctl -p tramo-api -p tramo-node-agent -p tramo-helper
      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tramoctl* dist/ 2>/dev/null || true
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: tramo-${{ matrix.target }}
          path: dist/*
      # Fase 8: firmar SHA256SUMS con cosign keyless (OIDC) y generar provenance SLSA.
