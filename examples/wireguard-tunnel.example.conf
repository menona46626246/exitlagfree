# Configuración WireGuard de EJEMPLO para importar como relay.
# Reemplaza las claves por las reales de TU servidor (nunca compartas tu clave privada).
# Formato estándar de wg-quick (wireguard.com/install).
#
# [Interface]
# PrivateKey = <TU clave privada, se cifra con DPAPI al importar>
# Address    = <tu IP dentro del túnel>/32
# DNS        = <opcional>
# MTU        = 1380
#
# [Peer]
# PublicKey    = <clave pública del servidor relay>
# AllowedIPs   = <prefijos que se enrutarán por el relay>
# Endpoint     = <host:puerto del relay>
# PersistentKeepalive = 25

[Interface]
PrivateKey = EAtQZ5wY5dC7x0KKkGzXTLpSfHIXaW0mFoLxKfLpeHs=
Address = 10.66.66.2/32
DNS = 1.1.1.1
MTU = 1380

[Peer]
PublicKey = 9lRfF3H0vGhIkQ8WcD6sJzXhN2K1qYtO5pLwVbE4mCk=
AllowedIPs = 10.66.66.0/24, 203.0.113.10/32
Endpoint = relay-cl.mi-servidor.example:51820
PersistentKeepalive = 25
