# Ejemplo de configuración WireGuard del CLIENTE para importar en
# GameRoute Optimizer (Relays → Importar .conf).
# En el SERVIDOR debe existir el [Peer] con la clave pública correspondiente
# a la clave privada de este archivo y su AllowedIPs.
#
# La app guardará la clave privada cifrada con DPAPI (solo Windows) y
# nunca la exportará.

[Interface]
# Direcciones que usará el túnel en este equipo (las asigna el servidor).
Address = 10.66.0.2/32, fd42:66::2/128
# DNS opcional que se usará dentro del túnel.
DNS = 1.1.1.1
# Clave PRIVADA de ejemplo (NO USAR): genera la tuya con: wg genkey
PrivateKey = 8M1AmXy0eJv3rN5sQwZzTkLpQkFhGcVbNjHyUaDsFgE=

[Peer]
# Clave PÚBLICA del servidor (relay).
PublicKey = aQwEXAMPLEwgEhnjZ2xm6pLvx9KXg8RlVcYzN0sTfUdI=
# Endpoint público del relay (IP o dominio + puerto UDP).
Endpoint = vpsmx.ejemplo.com:51820
# Rutas que el túnel puede servir (0.0.0.0/0 = todo; la app restringirá por destino si eliges
# el modo «solo destinos del juego»).
AllowedIPs = 0.0.0.0/0, ::/0
# Mantiene el túnel vivo a través de NAT.
PersistentKeepalive = 25
