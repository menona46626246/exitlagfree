---
- name: Instalar herramientas WireGuard
  ansible.builtin.package:
    name:
      - wireguard-tools
      - iptables
    state: present

- name: Habilitar reenvio IPv4
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_file: /etc/sysctl.d/99-tramo.conf
    reload: true

- name: Crear directorio de configuracion con permisos restrictivos
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Plantilla wg0.conf (sin claves en el repositorio)
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: Reiniciar WireGuard
  no_log: true

- name: Habilitar y arrancar la interfaz
  ansible.builtin.service:
    name: wg-quick@wg0
    enabled: true
    state: started

- name: Permitir solo el puerto UDP de WireGuard en el firewall del host
  ansible.builtin.debug:
    msg: "Revisa manualmente ufw/firewalld: permitir udp/{{ tramo_wg_port }} y exponer el agente {{ tramo_agent_port }} solo detras de proxy TLS"
